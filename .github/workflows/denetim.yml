name: Veri denetimi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['denetim.py', '.github/workflows/denetim.yml']

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python denetim.py
      - name: Sonuclari kaydet
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add denetim/denetim.csv
          git diff --cached --quiet || git commit -m "Veri denetimi"
          git pull --rebase -X theirs origin main
          git push
