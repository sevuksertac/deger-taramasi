name: Haftalik deger taramasi

on:
  schedule:
    - cron: '0 4 * * 1'   # Her pazartesi 04:00 UTC = 07:00 Türkiye saati
  workflow_dispatch:       # Actions sekmesinden elle çalıştırmak için
  push:                    # Kod değişince otomatik çalışır
    branches: [main]
    paths: ['tarama.py', '.github/workflows/tarama.yml', 'tickers.txt']

permissions:
  contents: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Paketleri kur
        run: pip install yfinance
      - name: SEC verilerini cek
        env:
          SEC_UA: ${{ vars.SEC_UA }}
        run: python tarama.py
      - name: Sonuclari kaydet
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add veri.csv sp500.txt
          git diff --cached --quiet || git commit -m "Veri guncellendi"
          git pull --rebase origin main
          git push
