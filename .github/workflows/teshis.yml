name: Teshis (gecici)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teshis.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy
      - env: {SEC_UA: '${{ vars.SEC_UA }}'}
        run: |
          python - <<'P'
          import os, tarama as T, backtest as B
          html = T.indir(T.SP500_URL, os.environ['SEC_UA']).decode('utf-8')
          print('uzunluk', len(html), 'changes' in html, 'id="changes"' in html)
          import re
          for m in sorted(set(re.findall(r'href="(/wiki/[^"#]*)"', html))):
              if 'S%26P' in m or 'hange' in m or 'S&amp;P' in m: print('LINK', m)
          i = html.lower().find('change'); print('CH', html[max(0,i-300):i+600].replace(chr(10),' '))
          P
