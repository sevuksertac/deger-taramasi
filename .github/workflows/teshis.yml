name: Teshis (gecici)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teshis.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy
      - env: {SEC_UA: '${{ vars.SEC_UA }}'}
        run: |
          python - <<'P'
          import os, tarama as T, backtest as B
          html = T.indir(T.SP500_URL, os.environ['SEC_UA']).decode('utf-8')
          print('uzunluk', len(html), 'changes' in html, 'id="changes"' in html)
          import json
          u='https://en.wikipedia.org/w/api.php?action=query&prop=revisions&titles=List_of_S%26P_500_companies&rvlimit=200&rvprop=ids|timestamp|size&format=json'
          d=json.loads(T.indir(u, os.environ['SEC_UA']))
          rv=list(d['query']['pages'].values())[0]['revisions']
          prev=None
          for r in rv:
              if prev is None or abs(r['size']-prev)>5000: print('REV', r['revid'], r['timestamp'], r['size'])
              prev=r['size']
          print('REV son', rv[-1]['timestamp'], len(rv))
          P
