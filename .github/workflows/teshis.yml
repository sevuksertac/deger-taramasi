name: Teshis (gecici)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teshis.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - env: {SEC_UA: '${{ vars.SEC_UA }}'}
        run: |
          python - <<'P'
          import os, json, tarama as T
          ua = os.environ['SEC_UA']
          f = json.loads(T.indir('https://data.sec.gov/api/xbrl/companyfacts/CIK0001403161.json', ua))
          g = f['facts']['us-gaap']; print('BILANCO', T.son_bilanco_tarihi(f))
          for tag in sorted(g):
              if 'PerShare' in tag or 'Shares' in tag or tag in ('NetIncomeLoss','ProfitLoss'):
                  for unit, u in g[tag]['units'].items():
                      son = max(u, key=lambda x: x['end'])
                      print('TAG', tag[:60], unit, son.get('start'), son['end'], son['val'], len(u))
          for cik, t in [('0001403161','V'), ('0001067983','BRK-B'), ('0000773840','HON'), ('0001141391','MA'), ('0000320193','AAPL'), ('0001166691','CMCSA'), ('0001754301','FOXA')]:
              f = json.loads(T.indir(f'https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json', ua))
              b = T.son_bilanco_tarihi(f); a = T.hisse_adedi(f, b)
              print('SONUC', t, b, a and f"{a/1e6:,.1f} mn")
          P
