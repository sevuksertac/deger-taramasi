name: Teshis (gecici)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teshis.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy
      - env: {SEC_UA: '${{ vars.SEC_UA }}'}
        run: |
          python - <<'P'
          import os, tarama as T, backtest as B
          html = T.indir(T.SP500_URL, os.environ['SEC_UA']).decode('utf-8')
          print('uzunluk', len(html), 'changes' in html, 'id="changes"' in html)
          o = B.TumTablolar(); o.feed(html)
          for tid, s in o.tablolar:
              print('TABLO', tid, len(s), [[(m[:25], th) for m, th in r] for r in s[:3]])
          i = html.find('Selected changes'); print('SC', i, html[i:i+1500] if i >= 0 else '')
          P
